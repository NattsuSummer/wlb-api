name: Deploy

# Runs after CI on main. Skips quietly until the Cloudflare secrets exist.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$D1_DATABASE_ID" ]; then
            echo "Cloudflare secrets not set yet — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - if: steps.check.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.check.outputs.ready == 'true'
        run: npm test
      - name: Set D1 database id
        if: steps.check.outputs.ready == 'true'
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
      - name: Apply migrations
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy worker
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy
