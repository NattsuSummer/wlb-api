name: Seed database (one time)

# Manual only. Seed data and the starting password live in repo secrets, never in the code:
#   SEED_DATA_B64  — gzip + base64 of seed/seed.json:  gzip -9 -c seed/seed.json | base64 -w0
#   SEED_PASSWORD  — starting password; every seeded user must change it on first login
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      SEED_DATA_B64: ${{ secrets.SEED_DATA_B64 }}
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
      - run: npx wrangler d1 migrations apply DB --remote
      - name: Build seed SQL
        run: |
          echo "$SEED_DATA_B64" | base64 -d | gunzip > seed/seed.json
          npx tsx scripts/build-seed-sql.ts seed/seed.json > seed/seed.sql
          grep -c '^INSERT' seed/seed.sql
      - run: npx wrangler d1 execute DB --remote --file seed/seed.sql
      - run: rm -f seed/seed.json seed/seed.sql
