name = "balance-our-day-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Comma-separated list of web origins allowed to call the API (CORS).
ALLOWED_ORIGINS = "https://balance-our-day.pages.dev,http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "balance-our-day"
# Filled in after `wrangler d1 create balance-our-day` (see README → Deploy).
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
